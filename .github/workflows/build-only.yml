name: Build Only

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      
      - name: Build
        shell: bash
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          ./build/build.sh Win64
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ikemen-GO-Windows
          path: bin/Ikemen_GO.exe
