name: Simple Build

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y golang-go libsdl2-dev libxmp-dev
    
    - name: Build Linux version
      run: |
        cd src
        go build -o ../Ikemen_GO_Linux .
    
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: Ikemen-GO-Linux
        path: Ikemen_GO_Linux
